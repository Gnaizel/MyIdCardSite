# Профиль для локального запуска: .\run-local.ps1
# Всё остальное, включая ключи, берётся из application.yaml и переменных
# окружения. Здесь только то, что отличает свою машину от прода.
spring:
  datasource:
    # В Docker приложение ходит к базе по имени контейнера, а с хоста —
    # по порту, который compose пробрасывает наружу.
    url: jdbc:postgresql://localhost:2346/visitor-db
